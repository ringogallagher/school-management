openapi: 3.0.3
info:
  title: School Management API
  version: 1.0.0
  description: |
    Responses use the envelope `{code, message, data}`. Authenticate with `Authorization: Bearer <token>` from `/api/auth/login`.
    Marks use the five-point scale (integers 1-5). The `Roles` line of every operation lists who may call it; `scoped` means
    admin and teacher, a student for themselves, a parent for linked children.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Envelope:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    Csv:
      description: CSV file (UTF-8 with BOM)
      content:
        text/csv:
          schema: {type: string}
    Error:
      description: Error (400 validation, 401 not signed in, 403 forbidden, 404 not found, 429 too many login attempts)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
  schemas:
    Envelope:
      type: object
      properties:
        code: {type: integer}
        message: {type: string}
        data: {}
    LoginRequest:
      type: object
      required: [email, password]
      properties: {email: {type: string, format: email}, password: {type: string}}
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties: {old_password: {type: string}, new_password: {type: string, minLength: 8}}
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, role]
      properties: {email: {type: string}, password: {type: string}, first_name: {type: string}, last_name: {type: string}, role: {type: string, enum: [admin, teacher, student, parent]}}
    NewsRequest:
      type: object
      required: [title, body]
      properties: {title: {type: string, maxLength: 200}, body: {type: string, maxLength: 10000}, pinned: {type: boolean}}
    ClassRequest:
      type: object
      required: [name, level, section, teacher_id]
      properties: {name: {type: string}, level: {type: string}, section: {type: string}, teacher_id: {type: integer, description: user id of the homeroom teacher}, max_students: {type: integer}}
    TeacherRequest:
      type: object
      required: [email, password, first_name, last_name]
      properties: {email: {type: string}, password: {type: string}, first_name: {type: string}, last_name: {type: string}, department: {type: string}, specialization: {type: string}}
    SubjectAssignment:
      type: object
      properties: {subject_ids: {type: array, items: {type: integer}}}
    StudentRequest:
      type: object
      required: [email, password, first_name, last_name, class_id, student_number]
      properties: {email: {type: string}, password: {type: string}, first_name: {type: string}, last_name: {type: string}, class_id: {type: integer}, student_number: {type: string}}
    SubjectRequest:
      type: object
      required: [name, code]
      properties: {name: {type: string}, code: {type: string}, description: {type: string}, credits: {type: integer}}
    ParentRequest:
      type: object
      required: [email, password, first_name, last_name]
      properties: {email: {type: string}, password: {type: string}, first_name: {type: string}, last_name: {type: string}, relationship: {type: string}, phone_number: {type: string}}
    AttendanceRequest:
      type: object
      required: [class_id, records]
      properties:
        class_id: {type: integer}
        date: {type: string, format: date, description: defaults to today}
        records:
          type: array
          items:
            type: object
            required: [student_id, status]
            properties: {student_id: {type: integer}, status: {type: string, enum: [present, absent, late, excused]}, remarks: {type: string}}
    GradeRequest:
      type: object
      required: [student_id, subject_id, marks]
      properties: {student_id: {type: integer}, subject_id: {type: integer}, marks: {type: integer, minimum: 1, maximum: 5}, term: {type: string, example: Q1}}
    TimetableRequest:
      type: object
      required: [class_id, subject_id, teacher_id, day_of_week, start_time, end_time]
      properties: {class_id: {type: integer}, subject_id: {type: integer}, teacher_id: {type: integer}, day_of_week: {type: integer, minimum: 0, maximum: 6, description: 0 = Sunday}, start_time: {type: string, example: '08:00'}, end_time: {type: string, example: '08:45'}, room_number: {type: string}}
    AnnounceRequest:
      type: object
      required: [title, message]
      properties: {title: {type: string}, message: {type: string}, role: {type: string, enum: [teacher, student, parent]}}
paths:
  /health:
    get:
      tags: [System]
      summary: "Liveness probe"
      description: "Roles: public"
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/login:
    post:
      tags: [Auth]
      summary: "Sign in, returns a JWT"
      description: "Roles: public"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/profile:
    get:
      tags: [Auth]
      summary: "Current user"
      description: "Roles: any"
      security: [{bearer: []}]
