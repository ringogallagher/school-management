        default: {$ref: '#/components/responses/Error'}
  /api/auth/register:
    post:
      tags: [Auth]
      summary: "Create an account (admin only; self-registration is closed)"
      description: "Roles: admin"
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
