name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Unit tests (race detector)
        run: go test -race -cover ./...
      - name: Build
        run: go build ./...

  integration:
    name: Migrations & seed against PostgreSQL
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: school_management
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/school_management?sslmode=disable
      PGPASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Apply migrations (up, down, up)
        run: |
          for f in migrations/*.up.sql; do psql -h localhost -U postgres -d school_management -v ON_ERROR_STOP=1 -f "$f"; done
          for f in $(ls migrations/*.down.sql | sort -r); do psql -h localhost -U postgres -d school_management -v ON_ERROR_STOP=1 -f "$f"; done
          for f in migrations/*.up.sql; do psql -h localhost -U postgres -d school_management -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Seed demo school (exercises every repository against real SQL)
        run: go run ./cmd/seed
      - name: Start server and check pages
        run: |
          go build -o api ./cmd/api
          JWT_SECRET=ci PORT=8080 ./api &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf http://localhost:8080/login | grep -q "Sign in"
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@school.test","password":"admin12345"}' | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -sf http://localhost:8080/api/users -H "Authorization: Bearer $TOKEN" | grep -q teacher
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' -d '{"email":"x@x","password":"password123","first_name":"x","role":"admin"}')" = "401"
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t school-management:ci .
